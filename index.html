<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f5">  
  <title>Chat</title> 
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="main.js" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
<main class="app">
  <header>
    <nav id="tabs" class="tabs" aria-label="Conversations"></nav>
    <div class="header-actions">
      <button class="icon-button" id="openChats"
        type="button" aria-label="Open chats" title="Open chats">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v2" />
          <path d="M3 7v11a2 2 0 0 0 2 2h12l4-8H7l-4 8" />
        </svg>
      </button>

      <button class="icon-button" id="saveChats"
        type="button" aria-label="Save all chats" title="Save all chats">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 3h12l3 3v15H4V3z"/>
          <path d="M8 3v6h8V3M8 21v-7h8v7"/>
        </svg>
      </button>

      <input id="chatFile" type="file" accept=".json,application/json" hidden>
    </div>
  </header>

  <section id="setup">
    <h1 id="setupTitle">Create a connection</h1>
    <p class="hint" id="setupHint">
      Copy the connection request and send it to the other person.
    </p>

    <div class="qr-frame">
      <div id="qrcode" aria-label="Connection QR code"></div>
    </div>

    <button class="primary" id="copy" disabled>Copy Request</button>

    <div class="divider">OR PASTE CONNECTION CODE</div>

    <textarea id="paste" placeholder="Paste..."
      autocomplete="off" spellcheck="false"
      aria-label="Paste connection code"></textarea>

    <p class="error" id="error" role="status"></p>
  </section>

  <section id="chat" aria-label="Chat">
    <div id="messages"></div>

    <form class="composer" id="composer">
      <div class="message-field">
        <textarea id="message" rows="1"
          placeholder="Message…" aria-label="Message" disabled></textarea>

        <button id="send" type="submit"
          aria-label="Send message" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22 2 11 13"/>
            <path d="m22 2-7 20-4-9-9-4Z"/>
          </svg>
        </button>
      </div>
    </form>
  </section>
</main>
</body>
</html>
