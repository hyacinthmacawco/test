
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f7f5">
<title>Chat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root {
  --bg: #f7f7f5;
  --panel: #fff;
  --ink: #20211f;
  --muted: #777970;
  --line: #e7e7e2;
  --accent: #245c4a;
  --bubble: #e9eee9;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 system-ui, sans-serif;
  min-height: 100dvh;
}

button, textarea { font: inherit; }

.app {
  width: min(100%, 720px);
  height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--panel);
}

header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  min-width: 0;
}

.tabs {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar { display: none; }

.tab {
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 10px;
  padding: 9px 12px;
  white-space: nowrap;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
}

.tab.active {
  background: #eeefeb;
  color: var(--ink);
}

.tab-add {
  min-width: 36px;
  padding: 7px 10px;
  font-size: 22px;
  line-height: 1;
  border: 1px dashed #c9cbc3;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 3px;
  flex: none;
}

.icon-button {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  padding: 8px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
}

.icon-button:hover { background: #f0f1ed; }

.icon-button svg {
  width: 21px;
  height: 21px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#setup {
  padding: 24px 20px;
  overflow: auto;
  text-align: center;
}

#setup h1 {
  font-size: 23px;
  margin: 2px 0 7px;
}

.hint {
  font-size: 14px;
  color: var(--muted);
  margin: 0 auto 20px;
  max-width: 410px;
}

.qr-frame {
  width: min(78vw, 290px);
  min-height: 220px;
  margin: 0 auto 12px;
  padding: 12px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

#qrcode {
  max-width: 100%;
  overflow: hidden;
}

#qrcode img,
#qrcode canvas {
  max-width: 100%;
  height: auto !important;
}

.primary {
  width: min(100%, 290px);
  border: 0;
  border-radius: 12px;
  padding: 13px 16px;
  background: var(--ink);
  color: #fff;
  font-weight: 650;
  cursor: pointer;
}

.primary:disabled { opacity: .45; }

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: 420px;
  margin: 22px auto;
  color: #999b93;
  font-size: 12px;
}

.divider::before,
.divider::after {
  content: "";
  height: 1px;
  background: var(--line);
  flex: 1;
}

#paste {
  width: min(100%, 420px);
  height: 76px;
  resize: vertical;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  background: #fafaf8;
  outline: none;
}

#paste:focus { border-color: #9aa99f; }

.error {
  color: #b33a32;
  font-size: 13px;
  min-height: 18px;
  margin: 8px auto 0;
  max-width: 420px;
}

#openChats[hidden],
#saveChats[hidden] {
  display: none !important;
}

#chat {
  display: none;
  flex: 1;
  min-height: 0;
  flex-direction: column;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 22px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-behavior: smooth;
}

.message {
  max-width: min(82%, 480px);
  padding: 10px 13px;
  border-radius: 17px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.4;
}

.message.mine {
  align-self: flex-end;
  background: var(--accent);
  color: white;
  border-bottom-right-radius: 5px;
}

.message.theirs {
  align-self: flex-start;
  background: var(--bubble);
  color: var(--ink);
  border-bottom-left-radius: 5px;
}

.empty {
  margin: auto;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  padding: 20px;
}

.composer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  width: 100%;
  padding: 0;
  margin: 0;
  background: var(--bg);
}

.message-field {
  display: flex;
  align-items: flex-end;
  width: 100%;
  margin: 0;
  padding: 8px;
  border: none;
  border-radius: 0;
  box-sizing: border-box;
  background: var(--input-bg);
}

.message-field textarea {
  flex: 1;
  min-width: 0;
  width: 100%;
  margin: 0;
  padding: 10px;
  border: none;
  border-radius: 0;
  outline: none;
  resize: none;
  background: transparent;
  box-sizing: border-box;
}

.message-field button {
  flex-shrink: 0;
  margin: 0;
  border: none;
  border-radius: 0;
}

#message {
  flex: 1;
  width: 100%;
  min-width: 0;
  max-height: 130px;
  resize: none;
  border: 0;
  border-radius: 0;
  padding: 8px 0;
  outline: none;
  background: transparent;
}

#message:focus { border-color: transparent; }

#send {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  flex: none;
  border: 0;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
}

#send svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#send:disabled { opacity: .4; }

@media (min-width: 600px) {
  .app {
    height: min(100dvh, 900px);
    margin: 20px auto;
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
  }

  body { padding: 0 12px; }
}
</style>
</head>

<body>
<main class="app">
  <header>
    <nav id="tabs" class="tabs" aria-label="Conversations"></nav>

    <div class="header-actions">
      <button class="icon-button" id="openChats"
        type="button" aria-label="Open chats" title="Open chats">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v2" />
          <path d="M3 7v11a2 2 0 0 0 2 2h12l4-8H7l-4 8" />
        </svg>
      </button>

      <button class="icon-button" id="saveChats"
        type="button" aria-label="Save all chats" title="Save all chats">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 3h12l3 3v15H4V3z"/>
          <path d="M8 3v6h8V3M8 21v-7h8v7"/>
        </svg>
      </button>

      <input id="chatFile" type="file" accept=".json,application/json" hidden>
    </div>
  </header>

  <section id="setup">
    <h1 id="setupTitle">Create a connection</h1>
    <p class="hint" id="setupHint">
      Copy the connection request and send it to the other person.
    </p>

    <div class="qr-frame">
      <div id="qrcode" aria-label="Connection QR code"></div>
    </div>

    <button class="primary" id="copy" disabled>Copy Request</button>

    <div class="divider">OR PASTE CONNECTION CODE</div>

    <textarea id="paste" placeholder="Paste..."
      autocomplete="off" spellcheck="false"
      aria-label="Paste connection code"></textarea>

    <p class="error" id="error" role="status"></p>
  </section>

  <section id="chat" aria-label="Chat">
    <div id="messages"></div>

    <form class="composer" id="composer">
      <div class="message-field">
        <textarea id="message" rows="1"
          placeholder="Message…" aria-label="Message" disabled></textarea>

        <button id="send" type="submit"
          aria-label="Send message" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22 2 11 13"/>
            <path d="m22 2-7 20-4-9-9-4Z"/>
          </svg>
        </button>
      </div>
    </form>
  </section>
</main>

<script>
const $ = selector => document.querySelector(selector);

const tabsEl = $("#tabs");
const setup = $("#setup");
const chat = $("#chat");
const paste = $("#paste");
const copy = $("#copy");
const qr = $("#qrcode");
const errorEl = $("#error");
const messagesEl = $("#messages");
const messageInput = $("#message");
const sendButton = $("#send");
const fileInput = $("#chatFile");

let conversations = [];
let activeId = null;
let nextId = 1;

function newConversation(name) {
  const number = nextId++;
  const c = {
    id: "c" + number,
    name: name || "Chat " + number,
    pc: null,
    channel: null,
    localCode: "",
    stage: "starting",
    busy: false,
    messages: [],
    viewChat: false
  };

  conversations.push(c);
  return c;
}

function active() {
  return conversations.find(c => c.id === activeId);
}

function setError(text = "") {
  errorEl.textContent = text;
}

function setActiveError(c, text = "") {
  if (activeId === c.id) setError(text);
}

function renderTabs() {
  tabsEl.innerHTML = "";

  conversations.forEach(c => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "tab" + (c.id === activeId ? " active" : "");
    button.textContent = c.name;
    button.title = "Double-click to rename";

    button.addEventListener("click", () => {
      activeId = c.id;
      renderActive();
    });

    button.addEventListener("dblclick", () => {
      const name = prompt("Conversation name:", c.name);

      if (name && name.trim()) {
        c.name = name.trim().slice(0, 40);
        renderTabs();
      }
    });

    tabsEl.appendChild(button);
  });

  const add = document.createElement("button");
  add.type = "button";
  add.className = "tab tab-add";
  add.textContent = "+";
  add.title = "New conversation";
  add.setAttribute("aria-label", "New conversation");

  add.addEventListener("click", () => {
    const c = newConversation();
    activeId = c.id;
    renderActive();
    createOffer(c);
  });

  tabsEl.appendChild(add);
}

function renderActive() {
  const c = active();
  if (!c) return;

  renderTabs();
  setError("");
  paste.value = "";
  qr.innerHTML = "";

  copy.disabled = !c.localCode;
  copy.textContent = c.stage === "answer" ? "Copy Answer" : "Copy Request";

  $("#setupTitle").textContent =
    c.stage === "answer" ? "Answer ready" : "Create a connection";

  $("#setupHint").textContent =
    c.stage === "answer"
      ? "Copy this answer and send it back to the person who shared the request."
      : "Send this request to the other person. They can paste it on their device.";

  if (c.localCode && typeof QRCode !== "undefined") {
    try {
      new QRCode(qr, {
        text: c.localCode,
        width: 260,
        height: 260,
        correctLevel: QRCode.CorrectLevel.L
      });
    } catch {
      setError("Could not generate QR. Use the copy button.");
    }
  }

  const divider = $(".divider");

  if (c.stage === "answer") {
    paste.style.display = "none";
    divider.style.display = "none";
  } else {
    paste.style.display = "";
    divider.style.display = "";
  }

  setup.style.display = c.viewChat ? "none" : "block";
  chat.style.display = c.viewChat ? "flex" : "none";

  const connected = c.channel && c.channel.readyState === "open";
  messageInput.disabled = !connected;
  sendButton.disabled = !connected;

  messageInput.value = "";
  messageInput.style.height = "auto";

  messagesEl.innerHTML = "";

  if (!c.messages.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No messages yet";
    messagesEl.appendChild(empty);
  } else {
    c.messages.forEach(m => appendMessageElement(m.text, m.kind));
  }

  messagesEl.scrollTop = messagesEl.scrollHeight;

  const isChatVisible = c.viewChat && c.channel && c.channel.readyState === "open";
  document.getElementById("openChats").hidden = !isChatVisible;
  document.getElementById("saveChats").hidden = !isChatVisible;
}

function appendMessageElement(text, kind) {
  const el = document.createElement("div");
  el.className = "message " + kind;
  el.textContent = text;
  messagesEl.appendChild(el);
}

function addMessage(c, text, kind) {
  c.messages.push({ text, kind });

  if (activeId === c.id) {
    const empty = messagesEl.querySelector(".empty");
    if (empty) empty.remove();

    appendMessageElement(text, kind);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
}

function makePeer(c) {
  c.pc = new RTCPeerConnection({
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" }
    ]
  });

  c.pc.onconnectionstatechange = () => {
    if (c.pc.connectionState === "connected") {
      c.viewChat = true;
      if (activeId === c.id) renderActive();
    }
  };

  c.pc.ondatachannel = event => setupChannel(c, event.channel);

  return c.pc;
}

function setupChannel(c, channel) {
  c.channel = channel;

  channel.onopen = () => {
    c.viewChat = true;
    if (activeId === c.id) renderActive();
  };

  channel.onclose = () => {
    // Keep the conversation history available if the connection closes.
  };

  channel.onmessage = event => {
    addMessage(c, String(event.data), "theirs");
  };
}

function waitForIce(c) {
  if (c.pc.iceGatheringState === "complete") {
    return Promise.resolve();
  }

  return new Promise(resolve => {
    const pc = c.pc;
    const timeout = setTimeout(resolve, 15000);

    pc.addEventListener("icegatheringstatechange", function handler() {
      if (pc.iceGatheringState === "complete") {
        clearTimeout(timeout);
        pc.removeEventListener("icegatheringstatechange", handler);
        resolve();
      }
    });
  });
}

function renderCode(c, code, type) {
  c.localCode = code;
  c.stage = type;

  if (activeId === c.id) renderActive();
}

async function createOffer(c) {
  try {
    makePeer(c);
    setupChannel(c, c.pc.createDataChannel("chat"));

    const offer = await c.pc.createOffer();
    await c.pc.setLocalDescription(offer);
    await waitForIce(c);

    renderCode(c, JSON.stringify(c.pc.localDescription), "offer");
  } catch (e) {
    setActiveError(c, "Could not create request: " + e.message);
  }
}

async function processCode(raw) {
  const c = active();

  if (!c || c.busy || !raw.trim()) return;

  let data;

  try {
    data = JSON.parse(raw.trim());
  } catch {
    return;
  }

  if (!data || !data.type || !data.sdp) return;

  c.busy = true;
  setActiveError(c, "");

  try {
    if (data.type === "offer" && c.stage === "offer") {
      // Replace this tab's unused offer with the received offer.
      if (c.pc) c.pc.close();

      makePeer(c);
      await c.pc.setRemoteDescription(data);

      const answer = await c.pc.createAnswer();
      await c.pc.setLocalDescription(answer);
      await waitForIce(c);

      c.viewChat = false;
      renderCode(c, JSON.stringify(c.pc.localDescription), "answer");

    } else if (data.type === "answer" && c.stage === "offer") {
      await c.pc.setRemoteDescription(data);

      c.viewChat = true;
      if (activeId === c.id) renderActive();

    } else {
      setActiveError(c, "This connection code does not match the current step.");
    }
  } catch (e) {
    setActiveError(c, "Could not use that code: " + e.message);
  } finally {
    c.busy = false;
  }
}

copy.addEventListener("click", async () => {
  const c = active();
  if (!c || !c.localCode) return;

  try {
    await navigator.clipboard.writeText(c.localCode);

    copy.textContent = "Copied";

    setTimeout(() => {
      if (activeId === c.id) {
        copy.textContent =
          c.stage === "answer" ? "Copy Answer" : "Copy Request";
      }
    }, 1300);
  } catch {
    setError("Clipboard unavailable. Copy the connection code manually.");
  }
});

paste.addEventListener("paste", () => {
  setTimeout(() => processCode(paste.value), 100);
});

paste.addEventListener("input", () => {
  if (paste.value.trim().endsWith("}")) {
    processCode(paste.value);
  }
});

$("#composer").addEventListener("submit", event => {
  event.preventDefault();

  const c = active();
  const text = messageInput.value.trim();

  if (!c || !text || !c.channel || c.channel.readyState !== "open") return;

  c.channel.send(text);
  addMessage(c, text, "mine");

  messageInput.value = "";
  messageInput.style.height = "auto";
  messageInput.focus();
});

messageInput.addEventListener("input", function() {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 130) + "px";
});

messageInput.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    $("#composer").requestSubmit();
  }
});

// Export the conversation names and message histories from every tab.
$("#saveChats").addEventListener("click", () => {
  const backup = {
    format: "serverless-p2p-chat",
    version: 1,
    savedAt: new Date().toISOString(),
    conversations: conversations.map(c => ({
      name: c.name,
      messages: c.messages
    }))
  };

  const blob = new Blob(
    [JSON.stringify(backup, null, 2)],
    { type: "application/json" }
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "p2p-chats.json";
  a.click();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

// Import a previously exported chat backup.
$("#openChats").addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", async () => {
  const file = fileInput.files && fileInput.files[0];
  if (!file) return;

  try {
    const backup = JSON.parse(await file.text());

    if (!Array.isArray(backup.conversations)) {
      throw new Error("This file is not a valid chat backup.");
    }

    // Close old connections before replacing the tab list.
    conversations.forEach(c => {
      if (c.pc) c.pc.close();
    });

    conversations = [];
    nextId = 1;

    backup.conversations.forEach(saved => {
      const c = newConversation(
        String(saved.name || "Chat " + nextId).slice(0, 40)
      );

      c.messages = Array.isArray(saved.messages)
        ? saved.messages
            .filter(m =>
              m &&
              typeof m.text === "string" &&
              (m.kind === "mine" || m.kind === "theirs")
            )
            .map(m => ({ text: m.text, kind: m.kind }))
        : [];
    });

    if (!conversations.length) {
      newConversation();
    }

    activeId = conversations[0].id;
    renderTabs();
    renderActive();

  } catch (e) {
    alert("Could not open chats: " + e.message);
  } finally {
    fileInput.value = "";
  }
});

// Start with one conversation.
const first = newConversation("Chat 1");
activeId = first.id;
renderActive();
createOffer(first);
</script>
</body>
</html>
