<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Chat</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="app">
    <!-- Connection setup -->
    <section id="setupView" class="setup-view">
      <div id="qrCode" class="qr-code"></div>
      <button id="copyCode" class="setup-copy" type="button">Copy Request</button>
      <div class="setup-separator"></div>
      <input id="pasteCode" type="text" placeholder="Paste..." autocomplete="off" />
    </section>

    <!-- Chat view -->
    <section id="chat" class="chat-view" hidden>
      <div id="messages" class="messages"></div>
    </section>

    <!-- Full-screen composer -->
    <section id="composeView" class="compose-view" hidden>
      <textarea id="composeText" placeholder="Write a message..." autofocus></textarea>
    </section>

    <!-- Shared floating toolbar -->
    <nav id="toolbar" class="toolbar" aria-label="Chat controls">
      <div class="toolbar-left">
        <div id="timeToolbar" class="toolbar-item">
          <button
            id="timeFilterButton"
            class="icon-button"
            type="button"
            aria-label="Filter by time"
            title="Filter by time"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 7v5l3 2"></path>
            </svg>
          </button>
          <div id="timeMenu" class="filter-menu" hidden>
            <button type="button" data-time="all">All time</button>
            <button type="button" data-time="hour">Last hour</button>
            <button type="button" data-time="day">Last 24 hours</button>
            <button type="button" data-time="week">Last 7 days</button>
          </div>
        </div>

        <div class="toolbar-item">
          <button
            id="userFilterButton"
            class="icon-button"
            type="button"
            data-menu="userMenu"
            aria-label="Filter by user"
            title="Filter by user"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path>
            </svg>
          </button>
          <div id="userMenu" class="filter-menu" hidden></div>
          <div id="composeUserMenu" class="filter-menu" hidden></div>
        </div>

        <div class="toolbar-item">
          <button
            id="domainFilterButton"
            class="icon-button"
            type="button"
            data-menu="domainMenu"
            aria-label="Filter by domain"
            title="Filter by domain"
          >
            <!-- Globe icon -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M3 12h18"></path>
              <path d="M12 3a15 15 0 0 1 0 18"></path>
              <path d="M12 3a15 15 0 0 0 0 18"></path>
            </svg>
          </button>
          <div id="domainMenu" class="filter-menu" hidden></div>
          <div id="composeDomainMenu" class="filter-menu" hidden></div>
        </div>
      </div>

      <div class="toolbar-center">
        <button
          id="versionButton"
          class="icon-button"
          type="button"
          aria-label="Version history"
          title="Version history"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M12 7v5l3 2"></path>
          </svg>
        </button>

        <button
          id="cancelComposeButton"
          class="icon-button"
          type="button"
          aria-label="Cancel composing"
          title="Cancel"
          hidden
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18"></path>
          </svg>
        </button>
      </div>

      <div class="toolbar-right">
        <button
          id="composeButton"
          class="icon-button"
          type="button"
          aria-label="Compose message"
          title="Compose message"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m22 2-7 20-4-9-9-4Z"></path>
            <path d="M22 2 11 13"></path>
          </svg>
        </button>

        <button
          id="composeSend"
          class="icon-button"
          type="button"
          aria-label="Send message"
          title="Send message"
          hidden
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m22 2-7 20-4-9-9-4Z"></path>
            <path d="M22 2 11 13"></path>
          </svg>
        </button>
      </div>
    </nav>

    <!-- Version history -->
    <section id="versionPanel" class="version-panel" hidden>
      <div class="version-header">
        <strong>Version history</strong>
        <button id="closeVersionPanel" class="icon-button" type="button" aria-label="Close version history">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18"></path>
          </svg>
        </button>
      </div>
      <div id="versionsList"></div>
      <div class="version-actions">
        <button id="saveVersionButton" type="button">Save version</button>
        <button id="openVersionButton" type="button">Open selected</button>
        <button id="exportChatsButton" type="button">Export chats</button>
        <button id="importChatsButton" type="button">Import chats</button>
        <input id="chatFile" type="file" accept="application/json,.json" hidden />
      </div>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
